plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jarvis.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.jarvis.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    // Vosk ऑफलाइन स्पीच रिकग्निशन लाइब्रेरी
    implementation 'net.sf.androidscents.signature:android-sdk-support:0.3.3'
    implementation 'com.alphacep:vosk-android:0.3.45@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@unstables'
}
