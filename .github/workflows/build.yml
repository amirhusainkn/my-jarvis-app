name: Build Android APK (Gradle)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle

    - name: Download Vosk Model Automatically
      run: |
        mkdir -p app/src/main/assets
        echo "Downloading Vosk model..."
        curl -L -o model.zip "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip"
        echo "Extracting model..."
        unzip -q model.zip
        rm -rf app/src/main/assets/model-en-us
        mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
        echo "Model setup complete!"

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/debug/app-debug.apk
        
