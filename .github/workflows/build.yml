name: Build Android APK (Gradle)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Write Clean AndroidManifest
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <application
                  android:label="Jarvis"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Download Vosk Model Automatically
        run: |
          rm -rf app/src/main/assets/model-en-us
          mkdir -p app/src/main/assets/model-en-us
          echo "Downloading US English Vosk model..."
          curl -L -sS --fail "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" -o model.zip
          unzip -q model.zip -d temp_model
          INNER_DIR=$(find temp_model -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$INNER_DIR" ]; then
            mv "$INNER_DIR"/* app/src/main/assets/model-en-us/
          else
            mv temp_model/* app/src/main/assets/model-en-us/
          fi
          rm -rf model.zip temp_model
          ls -la app/src/main/assets/model-en-us
          test -d app/src/main/assets/model-en-us/am
          echo "Model setup complete!"

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
